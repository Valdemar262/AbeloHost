services:
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: www-data
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: abelohost_test
      DB_USERNAME: blog_test
      DB_PASSWORD: test_password
    command: ["php", "tests/database.php"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_DATABASE: abelohost_test
      MYSQL_USER: blog_test
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: test_root_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
